name: CI & Release (Forgejo)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: docker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Python and JSON Files
        run: |
          python3 -m py_compile custom_components/cvm_e3_mini/*.py
          python3 -c "import json; [json.load(open(f)) for f in ['hacs.json', 'custom_components/cvm_e3_mini/manifest.json', 'custom_components/cvm_e3_mini/strings.json', 'custom_components/cvm_e3_mini/translations/en.json', 'custom_components/cvm_e3_mini/translations/it.json']]"
          echo "Validation completed successfully!"

  release:
    name: Create Forgejo Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: docker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Zip Archive
        run: |
          mkdir -p dist
          which zip || (apt-get update && apt-get install -y zip)
          zip -r dist/cvm_e3_mini.zip custom_components/cvm_e3_mini

      - name: Publish Forgejo Release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: dist
          token: ${{ secrets.GITHUB_TOKEN }}
