# ==============================================================================
# Circutor CVM-E3-MINI - Esempi di Schede Lovelace per la WebUI di Home Assistant
# ==============================================================================

type: vertical-stack
title: Analizzatore di Rete Circutor CVM-E3-MINI
cards:
  # 1. PANORAMICA POTENZA E RETE
  - type: glance
    title: Stato Rete Elettrica
    columns: 4
    entities:
      - entity: sensor.circutor_cvm_e3_mini_frequenza_di_rete
        name: Frequenza
      - entity: sensor.circutor_cvm_e3_mini_potenza_attiva_totale
        name: Potenza Attiva
      - entity: sensor.circutor_cvm_e3_mini_fattore_di_potenza_totale
        name: Fattore Potenza
      - entity: binary_sensor.circutor_cvm_e3_mini_errore_senso_ciclico_fasi
        name: Senso Ciclico

  # 2. DETTAGLIO PER FASE (L1, L2, L3)
  - type: entities
    title: Misure di Fase
    show_header_toggle: false
    entities:
      - type: section
        label: Tensione di Fase (V)
      - entity: sensor.circutor_cvm_e3_mini_tensione_l1
        name: Fase 1
      - entity: sensor.circutor_cvm_e3_mini_tensione_l2
        name: Fase 2
      - entity: sensor.circutor_cvm_e3_mini_tensione_l3
        name: Fase 3
      - type: section
        label: Corrente di Linea e Neutro (A)
      - entity: sensor.circutor_cvm_e3_mini_corrente_l1
        name: Corrente L1
      - entity: sensor.circutor_cvm_e3_mini_corrente_l2
        name: Corrente L2
      - entity: sensor.circutor_cvm_e3_mini_corrente_l3
        name: Corrente L3
      - entity: sensor.circutor_cvm_e3_mini_corrente_di_neutro
        name: Neutro
      - type: section
        label: Potenza Attiva per Fase (W)
      - entity: sensor.circutor_cvm_e3_mini_potenza_attiva_l1
        name: Potenza L1
      - entity: sensor.circutor_cvm_e3_mini_potenza_attiva_l2
        name: Potenza L2
      - entity: sensor.circutor_cvm_e3_mini_potenza_attiva_l3
        name: Potenza L3

  # 3. CONTATORI ENERGIA
  - type: entities
    title: Contatori Energia
    show_header_toggle: false
    entities:
      - entity: sensor.circutor_cvm_e3_mini_energia_attiva_consumata_totale
        name: Energia Prelevata (Consumo)
      - entity: sensor.circutor_cvm_e3_mini_energia_attiva_generata_totale
        name: Energia Immessa (Produzione)
      - entity: sensor.circutor_cvm_e3_mini_energia_reattiva_induttiva_consumata_totale
        name: Energia Reattiva Induttiva
      - entity: sensor.circutor_cvm_e3_mini_contatore_impulsi_ingresso_digitale
        name: Impulsi Ingresso Digitale

  # 4. CONTROLLI E RESET (Pulsanti e Selettori direttamente dalla WebUI)
  - type: entities
    title: Controlli e Reset
    show_header_toggle: false
    entities:
      - entity: select.circutor_cvm_e3_mini_selezione_tariffa
        name: Tariffa Attiva
      - entity: select.circutor_cvm_e3_mini_retroilluminazione_display
        name: Retroilluminazione Schermo
      - entity: button.circutor_cvm_e3_mini_azzera_valori_massimi
        name: Azzera Picchi Massimi
      - entity: button.circutor_cvm_e3_mini_azzera_valori_minimi
        name: Azzera Valori Minimi
      - entity: button.circutor_cvm_e3_mini_azzera_massima_richiesta
        name: Azzera Max Demand
      - entity: button.circutor_cvm_e3_mini_azzera_contatori_energia_trifase
        name: Azzera Contatori Energia Trifase
      - entity: button.circutor_cvm_e3_mini_azzera_contatore_impulsi
        name: Azzera Contatore Impulsi
