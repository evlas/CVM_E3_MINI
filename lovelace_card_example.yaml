# ==============================================================================
# Circutor CVM-E3-MINI - Example Lovelace Card for Home Assistant Dashboard
# ==============================================================================

type: vertical-stack
title: Circutor CVM-E3-MINI Analyzer
cards:
  # 1. POWER & GRID OVERVIEW
  - type: glance
    title: Electrical Grid Overview
    columns: 4
    entities:
      - entity: sensor.circutor_cvm_e3_mini_grid_frequency
        name: Frequency
      - entity: sensor.circutor_cvm_e3_mini_total_active_power
        name: Active Power
      - entity: sensor.circutor_cvm_e3_mini_total_power_factor
        name: Power Factor
      - entity: binary_sensor.circutor_cvm_e3_mini_phase_rotation_error
        name: Phase Rotation

  # 2. PER-PHASE DETAIL (L1, L2, L3)
  - type: entities
    title: Phase Measurements
    show_header_toggle: false
    entities:
      - type: section
        label: Phase Voltage (V)
      - entity: sensor.circutor_cvm_e3_mini_voltage_l1
        name: Phase 1
      - entity: sensor.circutor_cvm_e3_mini_voltage_l2
        name: Phase 2
      - entity: sensor.circutor_cvm_e3_mini_voltage_l3
        name: Phase 3
      - type: section
        label: Line & Neutral Current (A)
      - entity: sensor.circutor_cvm_e3_mini_current_l1
        name: Current L1
      - entity: sensor.circutor_cvm_e3_mini_current_l2
        name: Current L2
      - entity: sensor.circutor_cvm_e3_mini_current_l3
        name: Current L3
      - entity: sensor.circutor_cvm_e3_mini_neutral_current
        name: Neutral
      - type: section
        label: Active Power per Phase (W)
      - entity: sensor.circutor_cvm_e3_mini_active_power_l1
        name: Power L1
      - entity: sensor.circutor_cvm_e3_mini_active_power_l2
        name: Power L2
      - entity: sensor.circutor_cvm_e3_mini_active_power_l3
        name: Power L3

  # 3. ENERGY COUNTERS
  - type: entities
    title: Energy Counters
    show_header_toggle: false
    entities:
      - entity: sensor.circutor_cvm_e3_mini_total_active_energy_consumed
        name: Consumed Energy (Import)
      - entity: sensor.circutor_cvm_e3_mini_total_active_energy_generated
        name: Generated Energy (Export)
      - entity: sensor.circutor_cvm_e3_mini_total_inductive_reactive_energy_consumed
        name: Inductive Reactive Energy

  # 4. CONTROLS & RESETS
  - type: entities
    title: Controls & Reset
    show_header_toggle: false
    entities:
      - entity: select.circutor_cvm_e3_mini_display_backlight
        name: Display Backlight
      - entity: button.circutor_cvm_e3_mini_reset_three_phase_energy_counters
        name: Reset Three-Phase Energy
      - entity: button.circutor_cvm_e3_mini_reset_all_energy_counters
        name: Reset All Energy Counters
      - entity: button.circutor_cvm_e3_mini_reset_all_parameters
        name: Reset All Parameters
